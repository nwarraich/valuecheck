<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Analysis | ValueCheck</title>
  <style>
    body { font-family: sans-serif; background: #f5f8ff; padding: 2rem; max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 0.25rem; }
    p.sub { margin-top: 0; color: #334155; }

    .card { background: #fff; border-radius: 12px; padding: 1.25rem; border: 1px solid #e2e8f0; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

    label { display: block; font-weight: 600; color: #0f172a; margin-bottom: 0.35rem; }
    input, select {
      width: 100%;
      padding: 0.7rem;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      outline: none;
      font-size: 1rem;
      background: #fff;
    }
    input:focus, select:focus { border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30,58,138,0.15); }

    .actions { display: flex; gap: 0.75rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
    button {
      padding: 0.85rem 1.5rem;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
    }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .hint { color: #475569; font-size: 0.95rem; }

    .note { background: #fef3c7; padding: 1rem; margin: 1rem 0; border-radius: 10px; font-size: 0.95rem; border: 1px solid #fde68a; }
    .note ul { margin: 0.5rem 0 0 1.25rem; }

    #result { margin-top: 1.25rem; padding: 1.25rem; background: #e0ecff; border-radius: 12px; border-left: 5px solid #1e3a8a; display: none; }
    #result.error { background: #fee2e2; border-left-color: #dc2626; color: #991b1b; }

    .section-title { margin: 1rem 0 0.5rem; font-weight: 800; color: #0f172a; }
    .pill { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 999px; background: #dbeafe; color: #1e3a8a; font-weight: 700; font-size: 0.85rem; }

    .suburb-card {
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(226,232,240,0.95);
      border-radius: 12px;
      padding: 0.9rem;
      margin-top: 0.75rem;
    }
    .suburb-head { display:flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
    .suburb-name { font-weight: 800; color: #0f172a; }
    ul { margin: 0.35rem 0 0 1.25rem; }
    .small { font-size: 0.92rem; color: #334155; }
  </style>
</head>
<body>

  <h1>ValueCheck — Suburb Recommendations</h1>
  <p class="sub">Enter your details and get AI suburb suggestions + suitable property sizes.</p>

  <div class="note">
    <strong>What you’ll get:</strong>
    <ul>
      <li>5–8 suburb suggestions (Sydney/NSW by default)</li>
      <li>Reasons + tradeoffs for each suburb</li>
      <li>2–3 property size suggestions</li>
    </ul>
  </div>

  <div class="card">
    <div class="grid">
      <div>
        <label for="age">Age</label>
        <input id="age" type="number" min="16" max="100" placeholder="e.g., 22" />
      </div>

      <div>
        <label for="income">Annual income (AUD)</label>
        <input id="income" type="number" min="0" step="1000" placeholder="e.g., 85000" />
      </div>

      <div>
        <label for="savings">Savings (AUD)</label>
        <input id="savings" type="number" min="0" step="1000" placeholder="e.g., 30000" />
      </div>

      <div>
        <label for="goal">Goal</label>
        <select id="goal">
          <option value="">Select…</option>
          <option value="rent">Rent</option>
          <option value="buy">Buy</option>
          <option value="invest">Invest</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="analyzeBtn" onclick="analyze()">Analyse</button>
      <span class="hint">Tip: Press Ctrl + Enter</span>
    </div>
  </div>

  <div id="result"></div>

  <script>
    function escapeHtml(str) {
      return (str ?? "").toString()
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function analyze() {
      const age = document.getElementById("age").value.trim();
      const income = document.getElementById("income").value.trim();
      const savings = document.getElementById("savings").value.trim();
      const goal = document.getElementById("goal").value.trim();

      const btn = document.getElementById("analyzeBtn");
      const resultDiv = document.getElementById("result");

      if (!age || !income || !savings || !goal) {
        alert("Please fill in Age, Income, Savings, and Goal.");
        return;
      }

      // Backend still expects { listing_text: "..." } so we convert fields into a single string.
      const profileText = `age: ${age}, income: ${income}, savings: ${savings}, goal: ${goal}`;

      try {
        btn.disabled = true;
        btn.textContent = "Analyzing…";

        resultDiv.style.display = "block";
        resultDiv.classList.remove("error");
        resultDiv.innerHTML = `<span class="small">Working on recommendations…</span>`;

        const response = await fetch("http://127.0.0.1:8001/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ listing_text: profileText })
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();

        if (data.verdict === "Error") {
          resultDiv.classList.add("error");
          resultDiv.innerHTML = `<strong>⚠️ Error:</strong> ${escapeHtml(data.explanation)}`;
          return;
        }

        const ex = data.explanation;

        // If backend fallback returns string
        if (typeof ex === "string") {
          resultDiv.innerHTML = `
            <div><span class="pill">${escapeHtml(data.verdict || "AI Recommendations")}</span></div>
            <div class="section-title">Response</div>
            <div class="small">${escapeHtml(ex).replaceAll("\n", "<br>")}</div>
          `;
          return;
        }

        // Needs more info
        if (ex.mode === "needs_more_info") {
          resultDiv.innerHTML = `
            <div><span class="pill">Need more info</span></div>
            <div class="section-title">Questions</div>
            <ul>
              ${(ex.questions || []).map(q => `<li>${escapeHtml(q)}</li>`).join("")}
            </ul>
          `;
          return;
        }

        // Recommendations
        const sizes = (ex.property_size_suggestions || []).map(s => `<li>${escapeHtml(s)}</li>`).join("");
        const suburbsHtml = (ex.suburb_recommendations || []).map(r => {
          const why = (r.why_good || []).map(x => `<li>${escapeHtml(x)}</li>`).join("");
          const watch = (r.watch_out_for || []).map(x => `<li>${escapeHtml(x)}</li>`).join("");

          return `
            <div class="suburb-card">
              <div class="suburb-head">
                <div class="suburb-name">${escapeHtml(r.suburb)}, ${escapeHtml(r.state || "")}</div>
                <div class="pill">${escapeHtml(r.best_for || "")}</div>
              </div>
              <div class="section-title" style="margin-top:0.6rem;">Why it fits</div>
              <ul>${why}</ul>
              <div class="section-title">Tradeoffs</div>
              <ul>${watch}</ul>
            </div>
          `;
        }).join("");

        resultDiv.innerHTML = `
          <div><span class="pill">${escapeHtml(data.verdict || "AI Recommendations")}</span></div>

          <div class="section-title">Suggested property sizes</div>
          <ul>${sizes}</ul>

          <div class="section-title">Suburb recommendations</div>
          ${suburbsHtml || `<div class="small">No suburbs returned.</div>`}
        `;

      } catch (err) {
        resultDiv.style.display = "block";
        resultDiv.classList.add("error");
        resultDiv.innerHTML =
          `<strong>❌ Error:</strong> ${escapeHtml(err.message)}<br><br>` +
          `<span class="small">Make sure the backend is running on http://localhost:8001</span>`;
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Analyse";
      }
    }

    // Ctrl + Enter submits
    document.addEventListener("keydown", function(e) {
      if (e.ctrlKey && e.key === "Enter") analyze();
    });
  </script>

</body>
</html>
